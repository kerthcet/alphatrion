# One attempt: propose a variant of the best artifact, reject it if it's a
# duplicate, and score it otherwise. `end` returns to the pipeline using
# this one, so a rejected variant skips the evaluation.
name: attempt
nodes:
  - name: propose                   # -> Artifact
    type: action
    fn: propose
  - name: guard                     # Artifact, passed through
    type: guardrail
    checks: [not_duplicate]
    exit: {fail: end}
  - name: evaluate                  # Artifact -> Metrics
    type: evaluator
    fn: score
